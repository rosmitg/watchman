[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchman"
version = "0.1.0"
description = "AI-powered proactive portfolio intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "supabase",
    "python-jose[cryptography]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "langgraph",
    "langchain",
    "langchain-anthropic",
    "langsmith",
    "alpaca-py",
    "yfinance",
    "newsapi-python",
    "httpx",
    "pinecone-client",
    "voyageai",
    "transformers",
    "apscheduler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
