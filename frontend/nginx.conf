# nginx config for the Watchman frontend on Cloud Run.
#
# Serves the prebuilt React/Vite bundle as static files. No proxying — the
# frontend talks directly to the backend Cloud Run URL baked in at build time
# via VITE_API_URL. Listens on 8080 (Cloud Run's required container port).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets on the fly.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed JS/CSS assets are immutable — cache them aggressively.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached so clients always pick up new bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
