name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: watchman
          POSTGRES_PASSWORD: watchman
          POSTGRES_DB: watchman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./backend
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        working-directory: ./backend
        env:
          APP_ENV: test
          SECRET_KEY: test-secret
          SUPABASE_URL: http://localhost
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test
          DATABASE_URL: postgresql+asyncpg://watchman:watchman@localhost:5432/watchman
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test
          ALPACA_API_KEY: test
          ALPACA_SECRET_KEY: test
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          NEWS_API_KEY: test
          PINECONE_API_KEY: test
          PINECONE_INDEX_NAME: watchman-test
          VOYAGE_API_KEY: test
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_API_KEY: test
          LANGCHAIN_PROJECT: watchman-test
          HUGGINGFACE_API_KEY: test
        run: pytest

  deploy:
    # Only deploy on direct pushes to main, and only if tests passed.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required to mint the Workload Identity Federation token

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Trigger Cloud Build to build, push, and deploy via infra/gcp/cloudbuild.yaml.
      # Pass the commit SHA as the image tag (_TAG); COMMIT_SHA is not auto-set
      # for `gcloud builds submit`, only for trigger-based builds.
      - name: Trigger Cloud Build deploy
        run: gcloud builds submit --config infra/gcp/cloudbuild.yaml --substitutions=_TAG=${{ github.sha }} .
